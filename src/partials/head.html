<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<meta name="theme-color" content="#0e0f12">

<link rel="preload" href="assets/fonts/oswald-cyrillic-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/app.css">
<script>document.documentElement.classList.add("js");try{sessionStorage.getItem("cs-visited")&&document.documentElement.classList.add("is-return")}catch(e){}</script>
</head>
<!--
  НАСТРОЙКА: впиши свой Telegram-ник (без @) в data-tg ниже (на каждой странице).
  Все кнопки «Заказать» откроют чат с этим аккаунтом и готовым сообщением.
-->
<body class="is-loading" data-page="{{page}}" data-hero="{{hero}}" data-tg="claudeshop">
<a class="skip" href="#main">Перейти к содержанию</a>
<div class="progress" aria-hidden="true"><i></i></div>

<div class="loader" aria-hidden="true">
  <div class="loader__top mono"><span>Collection AW/26</span><span><b id="loaderNum">00</b>%</span></div>
  <div class="loader__word"><span>C</span><span>L</span><span>A</span><span>U</span><span>D</span><span>E</span><i></i><span class="o">S</span><span class="o">H</span><span class="o">O</span><span class="o">P</span></div>
  <div class="loader__bar"><i></i></div>
</div>
<div class="pt" aria-hidden="true"><div class="pt__logo"><b>CLAUDE</b><span>SHOP</span></div></div>
<div class="cursor" aria-hidden="true"><span class="cursor__label">Смотреть</span></div>
